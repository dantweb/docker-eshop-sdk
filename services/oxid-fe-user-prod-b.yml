  oxid-fe-user-prod-b:
    image: oxid-fe-user:local
    depends_on:
      - oxid-fe-user-prod
    environment:
      API_UPSTREAM: http://host.docker.internal
    volumes:
      - ./oxid-fe-user/instances/example-b:/etc/oxid-fe-instance:ro
    ports:
      - "8091:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
