  oxid-fe-user:
    build:
      context: containers/node-fe
    user: ${HOST_USER_ID}:${HOST_GROUP_ID}
    environment:
      npm_config_cache: /npm-cache
    volumes:
      - ./oxid-fe-user:/app:cached
      - ./oxid-fe-core:/oxid-fe-core:cached
      - ./data/npm:/npm-cache:cached
    ports:
      - "5173:5173"
    links:
      - "apache:localhost.local"
    extra_hosts:
      - "host.docker.internal:host-gateway"
