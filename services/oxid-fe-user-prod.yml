  oxid-fe-user-prod:
    build:
      context: .
      dockerfile: oxid-fe-user/Dockerfile
    image: oxid-fe-user:local
    environment:
      API_UPSTREAM: http://host.docker.internal
    volumes:
      # THIS deployment's config: a single-file mount over the image's default instance file
      # (a directory mount of the repo would expose plugin sources through /plugins/)
      - ./oxid-fe-user/oxid-config.yaml:/etc/oxid-fe-instance/oxid-config.yaml:ro
    ports:
      - "8090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
